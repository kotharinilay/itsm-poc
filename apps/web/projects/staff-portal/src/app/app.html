<ds-skip-link targetId="main-content" />

<header class="app-header">
  <p class="app-header__brand">Synthia — Staff</p>

  <nav class="app-nav" aria-label="Primary">
    <ul class="app-nav__list">
      @for (item of visibleNav(); track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="app-nav__link--active">{{ item.label }}</a>
        </li>
      } @empty {
        <li class="app-nav__empty">No modules are available to your roles.</li>
      }
    </ul>
  </nav>

  <p class="app-header__identity">
    @if (auth.isSignedIn()) {
      Signed in as {{ auth.session()?.displayName }}
    } @else {
      Not signed in
    }
  </p>
</header>

<main id="main-content" tabindex="-1" class="app-main">
  <router-outlet />
</main>
