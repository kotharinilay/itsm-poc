version: 1
rules_file: lang/python
applied_when: language == python
predefined: true
entries:

  # ---- PY1: mutable default argument ------------------------------------------------------------
  - id: lang/python#PY1
    text: Mutable default arguments are banned; use a None sentinel and initialize in the body.
    tier: core
    guarantee_mode: absent
    applies_when: [always]
    guidance: >
      Write `def f(items: list[int] | None = None): items = items or []` — take `None` as the default and
      build the mutable value inside the body. Never `def f(items=[])` / `def f(x=dict())`: the default is
      evaluated once at definition time and shared across every call, so state leaks between invocations.
    enforcement:
      - {kind: lint, detail: "Ruff B006 (mutable-argument-default) + B008 (function-call-in-default-argument) — flake8-bugbear = Bandit-independent; family B in the selected set; ruff check fails CI"}
    satisfies: ["principles#P25"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/mutable-argument-default",
               quote: "The same mutable object is then shared across all calls to the function.", status: current}

  # ---- PY2: bare except -------------------------------------------------------------------------
  - id: lang/python#PY2
    text: A bare except that hides errors is banned; catch specific exceptions.
    tier: core
    guarantee_mode: absent
    applies_when: [error-path]
    guidance: >
      Catch the narrowest exception you can act on (`except KeyError:`). A deliberate `except Exception:` is
      allowed only at a boundary that logs and re-raises. Never `except:` (bare) — it also swallows
      `KeyboardInterrupt`/`SystemExit` and hides real bugs.
    enforcement:
      - {kind: lint, detail: "Ruff E722 (bare-except) — pycodestyle E in the selected set; ruff check fails CI"}
    satisfies: ["anti-patterns#A15"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/bare-except",
               quote: "A bare `except` catches `BaseException` which includes `KeyboardInterrupt`, `SystemExit`, `Exception`, and others.", status: current}

  # ---- PY3: strict typing -----------------------------------------------------------------------
  - id: lang/python#PY3
    text: Public functions and methods carry type annotations and a static type checker gates the build in strict mode.
    tier: extended
    guarantee_mode: present
    applies_when: [public-contract-change, cross-module-write]
    guidance: >
      Annotate every public parameter and return (`def total(items: list[Order]) -> Money:`), and run the
      type checker in strict mode so untyped/partially-typed public surface fails the build. Prefer precise
      types (`X | None`, `Literal[...]`, `TypedDict`) over `Any`.
    enforcement:
      - {kind: analyzer, detail: "mypy --strict (or pyright strict) type gate — the type checker runs in strict mode and fails CI; not a Ruff lint code (Ruff does not type-check)"}
    satisfies: ["principles#P20"]
    citation: {tier: T1, kind: docs, url: "https://mypy.readthedocs.io/en/stable/command_line.html",
               quote: "This flag mode enables a defined subset of optional error-checking flags.", status: current}

  # ---- PY4: logging not print -------------------------------------------------------------------
  - id: lang/python#PY4
    text: Use the logging module in application/library code; print is banned.
    tier: extended
    guarantee_mode: absent
    applies_when: [logging-telemetry]
    guidance: >
      Obtain `logger = logging.getLogger(__name__)` and emit structured events
      (`logger.info("order %s placed", order_id)`); reserve `print` for a genuine CLI entrypoint only, so
      levels, handlers, and formatting stay configurable.
    enforcement:
      - {kind: lint, detail: "Ruff T201 (print) — flake8-print family T20; NOTE T20 is NOT in the baseline selected set (E,F,B,I,UP,S,PTH,SIM,ASYNC,DTZ) and must be added to select for this to fire; ruff check fails CI once selected"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/print",
               quote: "Print statements used for debugging should be omitted from production code.", status: current}

  # ---- PY5: f-strings ---------------------------------------------------------------------------
  - id: lang/python#PY5
    text: Prefer f-strings over percent-formatting and str.format (except lazy logging args).
    tier: extended
    guarantee_mode: convention
    applies_when: [always]
    guidance: >
      Use `f"total={total}"`. Keep `%`-style only inside logging calls (`logger.info("total=%s", total)`)
      where lazy interpolation matters. Ruff auto-fixes the conversion.
    enforcement:
      - {kind: lint, detail: "Ruff UP032 (f-string) + UP031 (printf-string-formatting) — pyupgrade UP in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/f-string",
               quote: "f-strings are more readable and generally preferred over `str.format` calls.", status: current}

  # ---- PY6: no assert for runtime validation ----------------------------------------------------
  - id: lang/python#PY6
    text: assert is banned for runtime validation in application code; raise an explicit exception.
    tier: core
    guarantee_mode: absent
    applies_when: [error-path]
    guidance: >
      Validate with an explicit raise (`if qty < 0: raise ValueError("qty must be >= 0")`). Never rely on
      `assert` for runtime checks — the interpreter strips every assert under `-O`/`PYTHONOPTIMIZE`, so the
      check silently disappears in production. (Asserts inside tests are fine.)
    enforcement:
      - {kind: lint, detail: "Ruff S101 (assert) = Bandit B101 — flake8-bandit S in the selected set; ruff check fails CI; exclude test paths via per-file-ignores"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/assert",
               quote: "Assertions are removed when Python is run with optimization requested (i.e., when the `-O` flag is present)", status: current}

  # ---- PY7: pathlib -----------------------------------------------------------------------------
  - id: lang/python#PY7
    text: Prefer pathlib.Path over os.path for filesystem paths.
    tier: extended
    guarantee_mode: convention
    applies_when: [always]
    guidance: >
      Build and manipulate paths with `pathlib.Path` (`Path(base) / "sub" / name`, `path.read_text()`,
      `path.exists()`) instead of `os.path.join` / `os.path.exists` / `open(str_path)`. Object paths are
      cross-platform and composable.
    enforcement:
      - {kind: lint, detail: "Ruff PTH family (flake8-use-pathlib), e.g. PTH118 (os-path-join), PTH123 (builtin-open) — PTH in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/os-path-join",
               quote: "`pathlib` offers a high-level API for path manipulation, as compared to the lower-level API offered by `os.path`.", status: current}

  # ---- PY8: no eval/exec on untrusted input -----------------------------------------------------
  - id: lang/python#PY8
    text: eval and exec on untrusted input are banned.
    tier: core
    guarantee_mode: absent
    applies_when: [user-input]
    guidance: >
      Never pass request/user data to `eval()` or `exec()` — that is arbitrary code execution. Parse with a
      typed, data-only mechanism instead (`json.loads`, `ast.literal_eval` for literals, an explicit dispatch
      table for "commands").
    enforcement:
      - {kind: lint, detail: "Ruff S307 (suspicious-eval-usage) = Bandit B307, plus S102 (exec-builtin) = Bandit B102 — flake8-bandit S in the selected set; ruff check fails CI"}
    satisfies: ["secure-coding#SC6"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/suspicious-eval-usage",
               quote: "The eval() function is insecure as it enables arbitrary code execution.", status: current}

  # ---- PY9: context managers --------------------------------------------------------------------
  - id: lang/python#PY9
    text: Files, locks, and connections opened without a context manager are banned.
    tier: extended
    guarantee_mode: absent
    applies_when: [always]
    guidance: >
      Acquire every resource in a `with` block (`with open(path) as f:`, `with lock:`, `async with pool.acquire() as conn:`)
      so it is released on the normal and exception paths. Do not hold a bare `open()` handle you must
      remember to `.close()`.
    enforcement:
      - {kind: lint, detail: "Ruff SIM115 (open-file-with-context-handler) — flake8-simplify SIM in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/open-file-with-context-handler",
               quote: "If a file is opened without a context manager, it is not guaranteed that the file will be closed", status: current}

  # ---- PY10: no shell=True on untrusted input ---------------------------------------------------
  - id: lang/python#PY10
    text: subprocess with shell=True on untrusted input is banned; pass an argument list.
    tier: core
    guarantee_mode: absent
    applies_when: [user-input, external-call]
    guidance: >
      Invoke external processes with an argument list and no shell — `subprocess.run(["git", "clone", url], check=True)`.
      Never `subprocess.run(f"git clone {url}", shell=True)`: a shell string built from input is command
      injection. Use the full executable path where feasible.
    enforcement:
      - {kind: lint, detail: "Ruff S602 (subprocess-popen-with-shell-equals-true)=B602, S603 (subprocess-without-shell-equals-true)=B603, S607 (start-process-with-partial-path)=B607 — flake8-bandit S selected; ruff check fails CI"}
    satisfies: ["secure-coding#SC3"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/subprocess-without-shell-equals-true",
               quote: "flagged by S603 because it bypasses the shell, which can be a security risk if the input is not properly validated", status: current}

  # ---- PY11: PEP 8 / pycodestyle ----------------------------------------------------------------
  - id: lang/python#PY11
    text: PEP 8 layout is enforced by the linter and formatter.
    tier: extended
    guarantee_mode: convention
    applies_when: [always]
    guidance: >
      Let `ruff format` (Black-compatible) own layout and `ruff check` own the pycodestyle rules; do not
      hand-format. Keep the E-family clean so style is never a review topic.
    enforcement:
      - {kind: lint, detail: "Ruff E-family (pycodestyle) + ruff format — E in the selected set (W is opt-in, add if desired); ruff check and ruff format --check fail CI"}
    citation: {tier: T1, kind: standard, url: "https://peps.python.org/pep-0008/",
               quote: "This document gives coding conventions for the Python code comprising the standard library in the main Python distribution.", status: current}

  # ---- PY12: pyflakes baseline ------------------------------------------------------------------
  - id: lang/python#PY12
    text: Unused imports/variables and undefined names are banned.
    tier: core
    guarantee_mode: absent
    applies_when: [always]
    guidance: >
      Ship no unused import, no unused local, and no reference to an undefined name. Remove dead code rather
      than leaving it "just in case"; the linter treats each as an error.
    enforcement:
      - {kind: lint, detail: "Ruff F401 (unused-import), F841 (unused-variable), F821 (undefined-name) — Pyflakes F (on by default) in the selected set; ruff check fails CI"}
    satisfies: ["principles#P8"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/unused-import",
               quote: "Unused imports add a performance overhead at runtime, and risk creating import cycles.", status: current}

  # ---- PY13: bugbear baseline -------------------------------------------------------------------
  - id: lang/python#PY13
    text: The flake8-bugbear (B) rule family is enabled so likely-bug idioms fail the build.
    tier: extended
    guarantee_mode: present
    applies_when: [configuration]
    guidance: >
      Keep `B` in the Ruff selected set so bugbear idioms (mutable defaults, `assert` tuples, useless
      comparisons, missing `raise ... from`) are caught; individual bans are stated in PY1/PY14. This entry
      guarantees the family is switched on.
    enforcement:
      - {kind: structural_test, detail: "assert the committed [tool.ruff.lint] select list contains B (flake8-bugbear); with B selected, ruff check then fails CI on every B-code violation"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/function-call-in-default-argument",
               quote: "Any function call that's used in a default argument will only be performed once, at definition time.", status: current}

  # ---- PY14: raise from -------------------------------------------------------------------------
  - id: lang/python#PY14
    text: Re-raising inside an except without preserving the cause is banned; use raise ... from.
    tier: core
    guarantee_mode: absent
    applies_when: [error-path]
    guidance: >
      When translating an exception, chain the cause: `raise DomainError("...") from exc`. Use bare `raise`
      to rethrow unchanged. Suppress a cause deliberately with `from None`. Never raise a new exception inside
      an `except` without `from`, which loses the original traceback/causality.
    enforcement:
      - {kind: lint, detail: "Ruff B904 (raise-without-from-inside-except) — flake8-bugbear B in the selected set; ruff check fails CI"}
    satisfies: ["anti-patterns#A30"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/raise-without-from-inside-except",
               quote: "When raising a new exception from within an `except` clause, it's recommended to include a `from` clause to explicitly set the exception's cause.", status: current}

  # ---- PY15: no hardcoded secret ----------------------------------------------------------------
  - id: lang/python#PY15
    text: Literal credentials, passwords, and tokens in source are banned.
    tier: core
    guarantee_mode: absent
    applies_when: [configuration, sensitive-data]
    guidance: >
      Read every secret from the environment or a secret store (`os.environ["DB_PASSWORD"]`, a settings
      object bound at startup). Never assign a credential literal (`PASSWORD = "hunter2"`,
      `connect(password="hunter2")`) in code or defaults.
    enforcement:
      - {kind: lint, detail: "Ruff S105 (hardcoded-password-string)=B105, S106 (hardcoded-password-func-arg)=B106, S107 (hardcoded-password-default)=B107 — flake8-bandit S selected; ruff check fails CI"}
    satisfies: ["anti-patterns#A24", "secure-coding#SC18"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/hardcoded-password-string",
               quote: "checks for potential uses of hardcoded passwords within strings in your code", status: current}

  # ---- PY16: safe deserialization ---------------------------------------------------------------
  - id: lang/python#PY16
    text: Deserializing untrusted data with pickle/marshal or an unsafe YAML loader is banned.
    tier: core
    guarantee_mode: absent
    applies_when: [serialization, user-input]
    guidance: >
      Parse untrusted input only with data-only loaders bound to explicit types: `json.loads`,
      `yaml.safe_load`, or a schema library. Never `pickle.loads`, `marshal.loads`, or `yaml.load(..., Loader=yaml.Loader)`
      on data you did not produce — each can instantiate arbitrary objects (RCE).
    enforcement:
      - {kind: lint, detail: "Ruff S301 (suspicious-pickle-usage)=B301, S302 (suspicious-marshal-usage)=B302, S506 (unsafe-yaml-load)=B506 — flake8-bandit S selected; ruff check fails CI"}
    satisfies: ["secure-coding#SC6"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/suspicious-pickle-import",
               quote: "These modules can pose security risks as they may execute arbitrary code during unpickling.", status: current}

  # ---- PY17: request timeout --------------------------------------------------------------------
  - id: lang/python#PY17
    text: An outbound HTTP call issued without an explicit timeout is banned.
    tier: core
    guarantee_mode: absent
    applies_when: [external-call]
    guidance: >
      Pass an explicit finite `timeout=` to every HTTP call (`requests.get(url, timeout=5)`,
      `httpx.get(url, timeout=5)`), or configure it once on a shared client/session. A call with no timeout
      can hang indefinitely and exhaust workers/connections.
    enforcement:
      - {kind: lint, detail: "Ruff S113 (request-without-timeout) = Bandit B113 — flake8-bandit S in the selected set; ruff check fails CI"}
    satisfies: ["performance#PF6"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/request-without-timeout",
               quote: "By omitting the `timeout` parameter, the program may hang indefinitely while awaiting a response.", status: current}

  # ---- PY18: no weak hash -----------------------------------------------------------------------
  - id: lang/python#PY18
    text: Weak/broken hash algorithms (MD5, SHA1) for security contexts are banned.
    tier: core
    guarantee_mode: absent
    applies_when: [sensitive-data]
    guidance: >
      Use `hashlib.sha256`/`sha512` for digests and a memory-hard KDF (`argon2`, `bcrypt`, `hashlib.scrypt`,
      or `pbkdf2_hmac`) for passwords. Never MD5/SHA1 for anything security-relevant; if a legacy digest is
      needed for a non-security checksum, mark it `usedforsecurity=False`.
    enforcement:
      - {kind: lint, detail: "Ruff S324 (hashlib-insecure-hash-function) = Bandit B324 (supersedes legacy B303) — flake8-bandit S in the selected set; ruff check fails CI"}
    satisfies: ["secure-coding#SC22"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/hashlib-insecure-hash-function",
               quote: "Weak or broken cryptographic hash functions may be susceptible to collision attacks", status: current}

  # ---- PY19: secure temp files ------------------------------------------------------------------
  - id: lang/python#PY19
    text: Insecure temporary files (tempfile.mktemp, hardcoded /tmp paths) are banned.
    tier: extended
    guarantee_mode: absent
    applies_when: [always]
    guidance: >
      Create temp files with `tempfile.NamedTemporaryFile()` / `tempfile.mkstemp()`, which open atomically
      with safe permissions. Never `tempfile.mktemp()` (returns a name, races between check and open — TOCTOU)
      or a hardcoded `/tmp/...` path.
    enforcement:
      - {kind: lint, detail: "Ruff S306 (suspicious-mktemp-usage)=B306, S108 (hardcoded-temp-file)=B108 — flake8-bandit S in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/suspicious-mktemp-usage",
               quote: "another process could create a file with the same name between the time the function returns and the time the caller creates the file", status: current}

  # ---- PY20: is for None ------------------------------------------------------------------------
  - id: lang/python#PY20
    text: Use is / is not for None comparisons, not == / !=.
    tier: extended
    guarantee_mode: convention
    applies_when: [always]
    guidance: >
      Test identity for the None singleton: `if value is None:` / `if value is not None:`. Do not write
      `value == None` — equality invokes `__eq__`, which a type may override with surprising results.
    enforcement:
      - {kind: lint, detail: "Ruff E711 (none-comparison) — pycodestyle E in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/none-comparison",
               quote: "Comparisons to singletons like None should always be done with `is` or `is not`, never the equality operators.", status: current}

  # ---- PY21: modern typing syntax ---------------------------------------------------------------
  - id: lang/python#PY21
    text: Use modern built-in generic and union syntax (PEP 585 / PEP 604).
    tier: extended
    guarantee_mode: convention
    applies_when: [always]
    guidance: >
      Annotate with `list[int]`, `dict[str, int]`, and `X | None` rather than `typing.List`, `typing.Dict`,
      or `Optional[X]`. Add `from __future__ import annotations` where a target runtime predates the syntax.
    enforcement:
      - {kind: lint, detail: "Ruff UP006 (non-pep585-annotation), UP007/UP045 (non-pep604 union/optional), UP035 (deprecated-import) — pyupgrade UP in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/non-pep585-annotation",
               quote: "PEP 585 enabled collections in the Python standard library (like `list`) to be used as generics directly", status: current}

  # ---- PY22: unified Ruff toolchain -------------------------------------------------------------
  - id: lang/python#PY22
    text: Ruff (lint + format) is adopted with an explicit selected rule set and runs in CI.
    tier: core
    guarantee_mode: present
    applies_when: [configuration]
    guidance: >
      Configure Ruff once in pyproject.toml with an explicit `select` set and run `ruff check` and
      `ruff format --check` in CI, replacing flake8/isort/black/bandit. This is the switch that makes every
      other PY entry a build-failing gate.
    enforcement:
      - {kind: host_wiring, detail: "pyproject.toml [tool.ruff.lint] select = [E,F,B,I,UP,S,PTH,SIM,ASYNC,DTZ]; ruff check and ruff format --check run in CI. Concrete emission owned by 11-profile-python.md"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/configuration/",
               quote: "Ruff can be configured through a `pyproject.toml`, `ruff.toml`, or `.ruff.toml` file.", status: current}

  - id: lang/python#PY23
    text: Blocking calls inside an async function (sleep, sync HTTP, sync file/subprocess I/O) are banned.
    tier: core
    guarantee_mode: absent
    applies_when: [concurrency, hot-path]
    guidance: >
      Inside `async def`, use the awaitable form: `await asyncio.sleep(n)`, an async HTTP client
      (`await httpx.AsyncClient().get(...)`), `asyncio.create_subprocess_exec`, or offload true blocking work
      with `await loop.run_in_executor(...)`. Never call `time.sleep`, `requests.get`, blocking `open`, or
      `input` on the event-loop thread.
    enforcement:
      - {kind: lint, detail: "Ruff ASYNC251 (blocking-sleep-in-async-function), ASYNC210 (blocking-http-call-in-async-function), ASYNC230 (blocking-open-call-in-async-function), ASYNC22x (subprocess) — flake8-async ASYNC in the selected set; ruff check fails CI"}
    satisfies: ["performance#PF1", "anti-patterns#A31"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/blocking-sleep-in-async-function",
               quote: "Calling time.sleep in an async function blocks the event loop. Use asyncio.sleep for non-blocking delays in asynchronous code.", status: current}

  - id: lang/python#PY24
    text: Timezone-naive datetime construction is banned; use timezone-aware datetimes.
    tier: extended
    guarantee_mode: absent
    applies_when: [always]
    guidance: >
      Build aware timestamps: `datetime.now(tz=timezone.utc)` and `datetime.fromtimestamp(ts, tz=timezone.utc)`.
      Never `datetime.now()`, `datetime.utcnow()`, or `datetime.today()` — naive datetimes silently bind to
      machine-local time and compare/serialize incorrectly across environments.
    enforcement:
      - {kind: lint, detail: "Ruff DTZ family (flake8-datetimez), e.g. DTZ005 (call-datetime-now-without-tzinfo), DTZ003 (call-datetime-utcnow), DTZ002 (call-datetime-today) — DTZ in the selected set; ruff check fails CI"}
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz",
               quote: "flag the use of naive datetime constructors, such as datetime.today() or datetime.utcnow(), and require explicit timezone arguments", status: current}

  - id: lang/python#PY25
    text: Building SQL by string-formatting or concatenating input is banned; parameterize.
    tier: core
    guarantee_mode: absent
    applies_when: [query, persistence-write, user-input]
    guidance: >
      Pass values as bound parameters: `cur.execute("SELECT * FROM t WHERE id = %s", (id,))`, SQLAlchemy
      `text("... :id").bindparams(id=id)`, or the ORM query API. Never `f"SELECT ... {id}"` or `"..." + id`
      into the query text — that is SQL injection.
    enforcement:
      - {kind: lint, detail: "Ruff S608 (hardcoded-sql-expression) = Bandit B608 — flake8-bandit S in the selected set; ruff check fails CI. NOTE S608 is a string-shape heuristic, not full taint dataflow"}
    satisfies: ["secure-coding#SC4", "anti-patterns#A25"]
    citation: {tier: T1, kind: docs, url: "https://docs.astral.sh/ruff/rules/hardcoded-sql-expression",
               quote: "Directly interpolating user input into SQL statements should always be avoided.", status: current}
