# .claude/rules/80-security-ops.md §80.3: no credential in source, in tests, or in committed local
# configuration. Also runs the dependency audits that caught a vulnerable OpenTelemetry and an
# out-of-support Electron - both were found by a gate, not by review.
#
# Replaces .github/workflows/security.yml.
#
# NOTE - open gap EG-6 (docs/governance/open-items.md §2): there is no Python
# dependency-vulnerability audit step here. .NET, web and desktop each have one. The gap is
# registered rather than closed; closing it is a separate, human-directed decision and this
# pipeline does NOT quietly add a step the baseline never asked for.

name: security

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ["*"]

schedules:
  # Weekly, so a newly published advisory against an unchanged dependency still surfaces.
  - cron: "0 6 * * 1"
    displayName: Weekly advisory sweep
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-latest

jobs:
  - job: secrets
    displayName: secret scan
    steps:
      # fetchDepth 0: Gitleaks scans history, not only the working tree.
      - checkout: self
        fetchDepth: 0

      - script: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz             https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --exit-code 1
        displayName: Gitleaks

  - job: dependencies
    displayName: dependency audit
    steps:
      - task: UseDotNet@2
        displayName: Install .NET 10 SDK
        inputs:
          version: 10.0.x

      - task: NodeTool@0
        displayName: Install Node 22
        inputs:
          versionSpec: "22.x"

      # NU1902/NU1903 are already warnings-as-errors in the build; this reports them explicitly.
      - script: dotnet list package --vulnerable --include-transitive
        workingDirectory: dotnet
        displayName: .NET vulnerable packages

      - script: npm audit --audit-level=high
        workingDirectory: apps/web
        displayName: Web audit

      - script: npm audit --audit-level=high
        workingDirectory: apps/desktop
        displayName: Desktop audit
