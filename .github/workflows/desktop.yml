name: desktop

# The Electron security suite. Every assertion corresponds to a control the constitution states
# unconditionally, and each fails when its switch is flipped - that is the gate
# (constitution Principle VII, plan Stage 4).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      # The renderer-contract suite reads the Angular bridge declaration, so a change there can
      # break this workflow. It must run when that file moves or its shape changes.
      - 'apps/web/projects/desktop-renderer/**'
      - 'build/scripts/verify-desktop-security-guard.sh'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  security-suite:
    name: typecheck, security suite, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Catches the class of mistake a test cannot see coming: an API that must never appear
      # anywhere in this package, on any code path, including one nobody has written yet.
      - name: Lint
        run: npm run lint

      # Asserts configuration rather than driving a window, so it runs on a machine with no
      # display. A security control that needs a real window is one CI skips.
      - name: Security suite
        run: npx vitest run

      # Plan Stage 4's gate is not "the suite passes" - it is "the suite passes AND fails
      # correctly when a setting is flipped". A suite that would stay green with sandbox off is
      # not evidence of anything, and nobody finds out until it matters. REQUIRED CHECK.
      - name: Verify the security suite fails correctly
        run: bash ../../build/scripts/verify-desktop-security-guard.sh

      - name: Build
        run: npm run build
