# Azure Container Apps configuration for the RagCore execution leg.
#
# The sibling of monolith.yaml, and deliberately the same shape where the shape is a control: the
# ingress block below is identical because the trust boundary must not be easier to satisfy on one
# deployable than the other. A rule that is cheaper to meet on one stack decides where the insecure
# code gets written.
#
# Placeholders in ${...} are substituted by the deployment pipeline. Nothing here is a secret: every
# secret arrives as a secret-reference environment variable resolved from Key Vault through the
# managed identity (constitution §Configuration).

apiVersion: 2024-03-01
type: Microsoft.App/containerApps
name: synthia-ragcore

identity:
  # User-assigned managed identity. Zero standing secrets: the application holds nothing that could
  # be exfiltrated and replayed, because it holds nothing.
  type: UserAssigned
  userAssignedIdentities:
    ${MANAGED_IDENTITY_RESOURCE_ID}: {}

properties:
  managedEnvironmentId: ${CONTAINER_APP_ENVIRONMENT_ID}

  configuration:
    activeRevisionsMode: Single

    ingress:
      # Internal only. Front Door with WAF is the sole public edge and APIM is the API trust
      # boundary; no application API is reachable by a path that bypasses the gateway
      # (constitution Principle I). External ingress here would be exactly that path.
      #
      # This is the NETWORK half of the apim-to-backend hop in build/policy/edge-trust.json, and it
      # is not sufficient alone: it admits anything already inside the VNet. The application half
      # is the client certificate below.
      external: false
      targetPort: 8000
      transport: http
      allowInsecure: false

      # GATEWAY PROVENANCE. `require` means ingress rejects a connection that presents no client
      # certificate, and republishes the one it validated as X-Forwarded-Client-Cert. Because
      # ingress sets that header itself, a caller cannot forge it - which is what lets
      # GatewayProvenanceMiddleware treat the hash in it as evidence rather than as input.
      #
      # `accept` would be worse than useless here: it forwards a certificate when one is offered
      # and nothing when one is not, so every unauthenticated caller would look identical to a
      # correctly configured one that had simply not been given a certificate yet.
      clientCertificateMode: require

    secrets:
      # Key Vault references, resolved through the managed identity at revision start. The values
      # never appear in this file, in the image, or in a pipeline log.
      - name: database-dsn
        keyVaultUrl: ${KEY_VAULT_URI}/secrets/synthia-ragcore-database-dsn
        identity: ${MANAGED_IDENTITY_RESOURCE_ID}

      # Application Insights. A connection string carries an instrumentation key, which is a WRITE
      # credential for a telemetry workspace: hold it and you can inject telemetry into somebody
      # else's dashboards. It is therefore a Key Vault reference like any other credential, never a
      # plain environment value and never baked into an image.
      - name: applicationinsights-connection-string
        keyVaultUrl: ${KEY_VAULT_URI}/secrets/synthia-appinsights-connection-string
        identity: ${MANAGED_IDENTITY_RESOURCE_ID}

    registries:
      - server: ${CONTAINER_REGISTRY}
        identity: ${MANAGED_IDENTITY_RESOURCE_ID}

  template:
    # THE DRAIN IS A GRACE PERIOD, NOT A GUARANTEE (plan Stage 10). Twenty-five seconds, the same as
    # the monolith, and the number is fixed by the plan rather than chosen per deployable.
    #
    # It matters more here than on the read-only monolith, because this deployable CLAIMS WORK, and
    # what happens when the drain elapses is stated rather than hoped about:
    #
    #   - An API replica stops accepting requests and finishes those in flight. Nothing is claimed,
    #     so nothing is at risk.
    #   - A worker replica PRE-CLAIM: the message returns to the queue, another replica takes it,
    #     and the atomic claim absorbs the duplicate that at-least-once delivery produces.
    #   - A worker replica POST-CLAIM, drain elapsed mid-execution: the work stays claimed,
    #     unexecuted and NON-RETRIABLE. This is exactly the approved-but-not-executed condition of
    #     ADR-0002. It surfaces in vw_approval_unexecuted_v1 and the staff portal, raises an
    #     operational alert, and recovers only through FRESH AUTHORIZATION. It is never silently
    #     re-fired, and a drain elapsing is never a reason to re-fire it.
    #
    # A LONGER DRAIN WOULD NOT FIX THAT, which is why it was not the answer. It would widen the
    # window in which a replica is neither serving nor gone, and the real control is elsewhere: the
    # work item's claim expiry, and the explicit timeout on every outbound call (Stage 9). The
    # scheduling rule that follows is that workers scale in on a drain longer than the longest
    # single external call - an execution that cannot finish inside the drain is one whose timeout
    # was set wrong.
    terminationGracePeriodSeconds: 25

    containers:
      - name: synthia-ragcore
        # Digest-pinned, never a floating tag. A tag is a pointer somebody else can move.
        image: ${CONTAINER_REGISTRY}/synthia-ragcore@${IMAGE_DIGEST}

        resources:
          # Explicit limits, not defaults. An unbounded container is one that takes the node down
          # with it rather than failing on its own.
          cpu: 2.0
          memory: 4Gi

        env:
          - name: SYNTHIA_ENVIRONMENT
            value: ${SYNTHIA_ENVIRONMENT}
          - name: SYNTHIA_DB_DSN
            secretRef: database-dsn
          - name: SYNTHIA_KEYVAULT_VAULT_URI
            value: ${KEY_VAULT_URI}
          - name: SYNTHIA_OTEL_SERVICE_NAME
            value: synthia-ragcore

          # The secret NAME, not the value. ragcore resolves it from Key Vault at startup through
          # the managed identity, and the resolved value is a SecretValue that redacts itself in
          # every rendering path (ragcore/src/ragcore/config/secrets.py).
          - name: SYNTHIA_OTEL_CONNECTION_STRING_SECRET_NAME
            value: synthia-appinsights-connection-string

          # Thirty days (spec FR-OPS-011). Audit keeps seven years, and the gap is what makes
          # "telemetry may never answer an audit question" true in practice rather than only in
          # policy: after a month the question demonstrably cannot be answered from here. The same
          # number is configured on the workspace in build/infra/monitoring/telemetry.json, and the
          # two are asserted to agree - a workspace quietly keeping more would defeat the rule from
          # outside the application.
          - name: SYNTHIA_OTEL_RETENTION_DAYS
            value: "30"

          # The proportion of ORDINARY journeys retained. Sampling is keyed on the correlation
          # identifier, so a journey that suspends and resumes hours later in another process is
          # sampled as one unit (spec FR-OPS-012); head sampling is prohibited. A trace carrying an
          # error, a governance denial or an approval is retained whatever this says.
          - name: SYNTHIA_OTEL_TRACE_SAMPLE_RATIO
            value: ${TRACE_SAMPLE_RATIO}

          # REDIS - TRANSIENT ONLY (constitution Principle IV). Never an authority, never a durable
          # record, and no sample flow reads it. There is no password or access-key setting here and
          # there will not be one: Entra authentication presents a token in the password position,
          # minted per connection by the managed identity, so the value that goes there is never
          # configuration. Authorization is a Redis ACCESS POLICY assigned to the identity's object
          # id - not an RBAC role assignment, which would deploy cleanly and then not connect
          # (build/infra/identity/managed-identities.json, notRoleBased).
          #
          # An empty host disables caching rather than failing. That is a supported deployed state:
          # the platform's correctness does not depend on the cache, so a process without one takes
          # the path every caller takes after an eviction.
          - name: SYNTHIA_REDIS_HOST
            value: ${REDIS_HOST}
          - name: SYNTHIA_REDIS_IDENTITY_OBJECT_ID
            value: ${MANAGED_IDENTITY_OBJECT_ID}

          # The SHA-256 hashes of the gateway client certificates this replica will accept,
          # comma-separated. NOT a secret: it is the hash of a public certificate, and holding it
          # gets an attacker nothing without the private key APIM holds.
          #
          # Comma-separated because rotation is an OVERLAP, and the order is the control: this
          # value widens to accept both certificates BEFORE APIM is cut over to the new one, and
          # narrows again afterwards. Doing those two in the other order is a total outage of every
          # audience, with no deployment behind it to point at.
          #
          # Automatic Key Vault sync is deliberately disabled for exactly that reason - it would
          # change the certificate on Azure's four-hour schedule while this list still pinned the
          # old hash. Rotation is a reviewed release: docs/runbooks/rotate-gateway-certificate.md.
          #
          # Required: an empty value fails the process at start (see build/policy/edge-trust.json),
          # because the alternative is a service that accepts forged identity and looks perfectly
          # healthy doing it.
          - name: SYNTHIA_EDGE_GATEWAY_CERTIFICATE_THUMBPRINTS
            value: ${GATEWAY_CERTIFICATE_THUMBPRINTS}

        probes:
          # These paths sit OUTSIDE every audience prefix, which is what lets them be served without
          # gateway provenance: the probe comes from the Container Apps infrastructure on the
          # internal network, does not traverse APIM, and carries no certificate. A probe published
          # under /api/... would have to be both publicly routed by Front Door and answerable
          # unauthenticated from the inside - a contradiction, not a configuration.

          # Liveness is process-only and performs no dependency check (constitution §Health). A
          # liveness probe that checked the database would restart every replica when the database
          # had a bad minute, turning a dependency blip into an outage.
          - type: Liveness
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness covers critical dependencies. A replica failing this is taken out of
          # rotation, not restarted — the correct response to a dependency that is temporarily
          # unreachable.
          - type: Readiness
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup gives a cold replica room to import and open its first connection without the
          # liveness probe killing it mid-start.
          - type: Startup
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20

        volumeMounts:
          # READ-ONLY ROOT FILESYSTEM, with every writable path named rather than implied.
          - volumeName: tmp
            mountPath: /tmp

    volumes:
      - name: tmp
        storageType: EmptyDir

    scale:
      minReplicas: 2
      maxReplicas: 20
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "20"
