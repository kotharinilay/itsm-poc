name: edge

# The edge trust boundary: Front Door + WAF -> APIM -> backend, with APIM as the identity/trust
# boundary (A1 §4.5, spec 10.3/13.4).
#
# WHY THIS IS A SEPARATE, REQUIRED WORKFLOW. Most of this boundary lives in files no compiler reads
# - an APIM policy, a Front Door definition, two ingress manifests - and a change touching only
# those files runs neither test suite. That is also the change most likely to open the boundary,
# because `external: false` -> `external: true` is one word and reviews as formatting.
#
# The rules are declared once, in build/policy/edge-trust.json, and enforced from three places:
# this workflow's guard, dotnet/tests/Synthia.ArchitectureTests/EdgeTrustPolicyTests.cs, and
# ragcore/tests/security/test_edge_trust_policy.py. Two hand-maintained lists drift; one file and
# three readers of it cannot.
#
# Gateway-to-backend certificate provenance is DEFERRED and is not checked here or anywhere else
# (docs/adr/0008-defer-certificate-based-gateway-to-backend-provenance.md).
#
# REQUIRED CHECK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-path:
    name: all traffic traverses the edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Edge path check
        run: bash build/scripts/check-edge-path.sh

      # Proves the guard still fails on a planted violation. Every check in the guard is a grep
      # against a rarely-edited file, and a grep that has stopped matching reports success just as
      # loudly as one that matches: the failure mode of this guard is silence.
      - name: Verify the guard fails correctly
        run: bash build/scripts/verify-edge-guard.sh

  edge-trust:
    name: edge trust policy holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ragcore/uv.lock

      - name: Sync Python (locked)
        working-directory: ragcore
        run: uv sync --all-groups --frozen

      # THE BEHAVIOURAL HALF IS GONE, and its absence is the point rather than an oversight.
      # It asserted that a forged identity context sent from inside the network was refused on
      # gateway provenance. That mechanism is deferred (ADR 0008) and nothing replaced it, so the
      # assertion is no longer true and was removed rather than weakened into something that
      # passes. See docs/adr/0008-defer-certificate-based-gateway-to-backend-provenance.md.
      #
      # What remains is the structural half: the shared policy, the APIM policies, the Front Door
      # definition and the ingress manifests all agree, and APIM still deletes every inbound copy
      # of the identity contract.
      - name: .NET — edge trust policy
        working-directory: dotnet
        run: dotnet test tests/Synthia.ArchitectureTests/Synthia.ArchitectureTests.csproj --filter "FullyQualifiedName~EdgeTrustPolicy"

      - name: RagCore — edge trust policy
        working-directory: ragcore
        run: uv run pytest tests/security/test_edge_trust_policy.py -v
