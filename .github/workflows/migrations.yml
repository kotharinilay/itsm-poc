name: migrations

# ADR-0003: Alembic owns every migration. Migrations run as a gated job before revision
# activation, NEVER at application startup - Container Apps runs multiple replicas and scales to
# zero, so anything at startup runs concurrently, repeatedly, at unpredictable times.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ragcore/migrations/**'
      - 'ragcore/src/ragcore/persistence/**'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic:
    name: single head, upgrade, downgrade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragcore
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synthia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ragcore/uv.lock

      - name: Sync (locked)
        run: uv sync --all-groups --frozen

      # pytest-alembic asserts single head, upgrade from base, models match DDL, and that
      # EVERY downgrade succeeds. The four tests are imported explicitly by
      # tests/migrations/test_migrations.py, so `--test-alembic` is not passed: it would inject a
      # second, differently-configured copy of the same four.
      #
      # SYNTHIA_TEST_DB_DSN points the suite at the service container above. Without it the
      # fixtures start their own via Testcontainers, which on a runner that already has one is a
      # container per run for no benefit.
      - name: Migration and persistence tests
        env:
          SYNTHIA_TEST_DB_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/synthia_test
        run: uv run pytest -q -m integration

      # The rest of the suite — structural, architectural, unit — needs no database, and running
      # it here keeps a schema change from passing while breaking something that reads the models.
      - name: Everything else
        run: uv run pytest -q -m "not integration"
