# Alembic — the only tool that changes the platform schema (ADR-0001, ADR-0003).
#
# Migrations run as a GATED JOB before revision activation, never at application startup.
# Container Apps runs multiple replicas and scales to zero, so anything at startup runs
# concurrently, repeatedly, and at unpredictable times.
#
# There is deliberately no `sqlalchemy.url` here. The DSN is resolved from Key Vault through
# `SYNTHIA_DB_DSN` by `migrations/env.py`, so a connection string is never committed and a
# reviewer seeing one in this file knows immediately that something is wrong.

[alembic]
script_location = migrations
prepend_sys_path = src

# A date prefix, so `ls versions/` reads in the order the revisions were written. The revision
# identifier remains the authority for ordering; this is for humans.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

timezone = UTC

# Alembic's own bookkeeping lives in the schema Alembic owns, alongside the tables it manages —
# not in `public`, which no principal here has rights over.
version_table = alembic_version
version_table_schema = platform

[post_write_hooks]
# The formatter is authoritative (constitution §Python baseline). A generated revision is
# formatted like every other file, so a migration never shows up as a diff of whitespace.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
