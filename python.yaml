version: 1
rules_file: profiles/python
applied_when: "language == python"
predefined: true                      # static; applied directly by §15/§16 — no scoring, no fork
baseline: "py312"              # requires-python >=3.12; owner-configurable (see open items)

# ── toolchain ─────────────────────────────────────────────────────────────
# Each row: what to emit, the value to set, and the T1 citation. These are the
# community defaults; "no bikeshedding" — Ruff replaces flake8/isort/black.
toolchain:
  linter:
    emit: pyproject.toml              # committed; [tool.ruff.lint]
    set:
      tool: "ruff check"
      select: ["E", "F", "B", "I", "UP", "S", "PTH", "SIM", "ASYNC", "DTZ"]
      # E=pycodestyle F=Pyflakes B=flake8-bugbear I=isort UP=pyupgrade
      # S=flake8-bandit PTH=flake8-use-pathlib SIM=flake8-simplify
      # ASYNC=flake8-async DTZ=flake8-datetimez
      note: "default select is only [E4,E7,E9,F] — the selected set must be written explicitly."
    citation:
      url: https://docs.astral.sh/ruff/settings/#lint_select
      status: current
  formatter:
    emit: pyproject.toml              # [tool.ruff.format]; Black-compatible.
    set:
      tool: "ruff format"
      quote-style: double             # Ruff default (== Black).
    citation:
      url: https://docs.astral.sh/ruff/formatter/
      status: current
  import_sort:
    emit: pyproject.toml              # [tool.ruff.lint.isort]; the `I` rule set replaces standalone isort.
    set:
      via: "Ruff `I` (isort) — enabled by inclusion in select above."
    citation:
      url: https://docs.astral.sh/ruff/rules/#isort-i
      status: current
  type_checker:
    emit: pyproject.toml              # [tool.mypy] strict = true  OR  [tool.pyright] typeCheckingMode = "strict"
    set:
      tool: "mypy --strict  (or)  pyright (typeCheckingMode=strict)"
      mode: strict
      ci_gate: true
    citation:
      url: https://mypy.readthedocs.io/en/stable/command_line.html#cmdoption-mypy-strict
      status: current
  security:
    emit: pyproject.toml              # Ruff `S` = flake8-bandit (the Bandit rule subset), enabled in select.
    set:
      via: "Ruff `S` (flake8-bandit) — no separate Bandit run needed."
    citation:
      url: https://docs.astral.sh/ruff/rules/#flake8-bandit-s
      status: current
  packaging:
    emit: pyproject.toml              # PEP 621 [project] metadata + a pinned lockfile committed alongside.
    set:
      metadata: "pyproject.toml (PEP 621) [project] table"
      lockfile: "pinned via uv (uv.lock) | Poetry (poetry.lock) | pip-tools (requirements*.txt)"
    citation:
      url: https://peps.python.org/pep-0621/
      status: current

# ── strictness ────────────────────────────────────────────────────────────
# CI-failing switches. Each realizes a lang/python rule id (PY3/PY22 in 10-lang-python.md).
strictness:
  - id: P-PY-S1
    flag: "[tool.mypy] strict = true   (or [tool.pyright] typeCheckingMode = \"strict\")"
    emit: pyproject.toml
    realizes: lang/python#PY3           # static null/type safety on public APIs; CI gate
    detail: >
      mypy --strict turns on disallow-untyped-defs, disallow-untyped-calls,
      disallow-incomplete-defs, check-untyped-defs, warn-return-any, strict-equality,
      no-implicit-reexport, warn-unused-ignores; pyright strict is the equivalent rule set.
    citation: {url: "https://mypy.readthedocs.io/en/stable/command_line.html#cmdoption-mypy-strict", status: current}
  - id: P-PY-S2
    flag: "[tool.ruff.lint] select includes S, ASYNC, B, DTZ, PTH (+ E,F,I,UP,SIM)"
    emit: pyproject.toml
    realizes: lang/python#PY22          # the ban/bug-prevention set: security, async, bugbear, tz, pathlib
    detail: >
      S (bandit) = security; ASYNC = async-correctness; B = likely bugs;
      DTZ = timezone-aware datetimes; PTH = pathlib over os.path.
    citation: {url: "https://docs.astral.sh/ruff/rules/", status: current}
  - id: P-PY-S3
    flag: "ruff check  +  ruff format --check  run as FAILING CI steps"
    emit: ".github/workflows (CI)"
    realizes: null                      # profile-native: without this, select/strict never bite
    detail: >
      No auto-suppress; a violation fails CI. Suppression only via a justified
      `# noqa: <code>` on the specific line (reason after the code), never a blanket ignore.
    citation: {url: "https://docs.astral.sh/ruff/linter/#error-suppression", status: current}

# ── conventions (→ §16) ─────────────────────────────────────────────────────
# P-PY-1..6 conventions, each with an enforcement{kind,detail}.
# Mechanical-first (CONTRACT §1.4): naming/PEP8 + modern typing bind to Ruff lint
# codes; commits/ADR/docs fall to convention/pr_review and are FLAGGED in open items.
conventions:
  - id: P-PY-1
    item: file/symbol naming
    default: "snake_case modules + functions; PascalCase classes; PEP 8 throughout."
    enforcement:
      kind: lint
      detail: >
        PEP 8 layout/whitespace is covered by Ruff `E` (pycodestyle, in the selected set).
        snake_case/PascalCase *naming* is Ruff `N` (pep8-naming: N801 class CapWords,
        N802 function lowercase, N806 variable) — `N` is NOT in the base selected set and
        must be ADDED to select to make naming mechanical; otherwise pr_review. See open items.
    citation: {url: "https://docs.astral.sh/ruff/rules/#pep8-naming-n", status: current}
  - id: P-PY-2
    item: test layout
    default: "tests/ package; pytest; test_*.py files; descriptive test names."
    enforcement:
      kind: pr_review        # FLAGGED — pytest discovers test_*.py but does not FAIL on layout/naming
      detail: >
        structural: a solution-layout check can assert tests/ exists and files match test_*.py;
        pytest's own discovery convention is not a failing gate, and descriptive-name quality is pr_review-only.
    citation: {url: "https://docs.pytest.org/en/stable/explanation/goodpractices.html#conventions-for-python-test-discovery", status: current}
  - id: P-PY-3
    item: modern typing
    default: "modern typing (list[int], X | None; PEP 585/604); annotate public APIs."
    enforcement:
      kind: lint
      detail: >
        Ruff `UP` (pyupgrade, in the selected set) rewrites legacy typing to PEP 585/604 forms
        (UP006 List->list, UP007/UP045 Optional/Union->X | Y); mypy/pyright strict (P-PY-S1)
        enforces that public APIs are actually annotated (disallow-untyped-defs).
    citation: {url: "https://docs.astral.sh/ruff/rules/#pyupgrade-up", status: current}
  - id: P-PY-4
    item: commits / versioning
    default: "Conventional Commits + SemVer."
    enforcement:
      kind: pr_review        # FLAGGED — CI commit-message linter possible, but no in-box Python gate
      detail: "convention: enforce via a commit-message CI check + release tooling; nothing mechanical inside ruff/mypy."
    citation: {url: "https://www.conventionalcommits.org/en/v1.0.0/", status: current}
  - id: P-PY-5
    item: ADR
    default: "MADR in docs/adr/, sequential numbering, status field."
    enforcement:
      kind: pr_review        # FLAGGED — documentation convention, no mechanical gate
      detail: "convention: a structural check can assert docs/adr/ exists + numbering monotonic; content review is pr_review."
    citation: {url: "https://adr.github.io/madr/", status: current}
  - id: P-PY-6
    item: README / docs
    default: "Diataxis structure; C4 diagrams; quickstart + ADR pointer."
    enforcement:
      kind: pr_review        # FLAGGED — documentation convention, no mechanical gate
      detail: "convention: doc structure + diagram presence are pr_review-only."
    citation: {url: "https://diataxis.fr/", status: current}
