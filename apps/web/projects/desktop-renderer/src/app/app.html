<ds-skip-link targetId="main-content" />

<header class="app-header">
  <p class="app-header__brand">Synthia</p>

  <nav class="app-nav" aria-label="Primary">
    <ul class="app-nav__list">
      <li>
        <a routerLink="/sessions" routerLinkActive="app-nav__link--active">Your sessions</a>
      </li>
    </ul>
  </nav>

  <p class="app-header__identity">
    @if (auth.isSignedIn()) {
      Signed in as {{ auth.session()?.displayName }}
    } @else {
      Not signed in
    }
  </p>
</header>

<main id="main-content" tabindex="-1" class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <p role="status">
    @if (desktop.isAvailable()) {
      Desktop host connected.
    } @else {
      Running outside the desktop host — host actions are unavailable.
    }
  </p>
</footer>
