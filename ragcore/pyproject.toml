[project]
name = "ragcore"
version = "0.1.0"
description = "Synthia RagCore — orchestration, execution, and every state-changing operation"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# RagCore owns orchestration, execution and ALL writes (ADR-0001). It has no dependency on the
# .NET monolith in either direction — they meet only at PostgreSQL and Service Bus.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "alembic-utils>=0.8",
    "azure-servicebus>=7.14",
    "azure-identity>=1.25",
    "azure-keyvault-secrets>=4.11",
    "httpx>=0.28",
    "mcp>=2.2",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "azure-monitor-opentelemetry>=1.8",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-alembic>=0.12",
    "testcontainers[postgres]>=4.15",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcore"]

# ---------------------------------------------------------------------------
# Ruff — constitution §Python baseline. The FORMATTER IS AUTHORITATIVE.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "workers"]

[tool.ruff.lint]
# Exactly the selection the constitution names. `N` is included so naming is mechanically
# enforced rather than reviewed.
select = ["E", "F", "B", "I", "UP", "S", "PTH", "SIM", "ASYNC", "DTZ", "N"]

# Blanket ignores MUST NOT be committed. Suppression is a justified `# noqa: <code>` on the
# specific line. This list is deliberately empty and stays that way.
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101 (assert) — the constitution permits `assert` in tests and prohibits it everywhere else.
# This is the mechanism for that split, not a relaxation of it.
"tests/**/*.py" = ["S101"]
# Alembic generates revision identifiers that are not valid Python identifiers by our naming rules.
"migrations/versions/*.py" = ["N999", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — authoritative type checker. The constitution permits mypy OR Pyright;
# this project chooses mypy, and CI runs it as a failing step.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "workers", "tests"]

[[tool.mypy.overrides]]
# Third-party packages that ship no stubs. Listed individually so a new untyped dependency is a
# deliberate addition rather than something a wildcard absorbs silently.
module = ["alembic_utils.*", "pytest_alembic.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires a real collaborator (database, messaging) via Testcontainers",
    "isolation: proves no path returns another organisation's data",
    "governance: proves treatment comes from the catalogue, never from model output",
    "approval: proves binding, expiry, first-valid-verdict-wins",
    "idempotency: proves at-least-once delivery produces exactly one effect",
    "concurrency: proves concurrent claims resolve to one outcome",
    "security: proves a documented prohibition is actually unreachable",
    "e2e: a representative journey through every layer",
]
