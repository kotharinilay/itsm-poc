version: 1
rules_file: profiles/dotnet
applied_when: "language in [dotnet, csharp]"
predefined: true                      # static; applied directly by §15/§16 — no scoring, no fork
baseline: net10.0    # current LTS (Nov 2025 → Nov 2028)

# ── toolchain ─────────────────────────────────────────────────────────────
# Each row: what to emit, the value to set, and the T1 citation. These are the
# community defaults; "no bikeshedding" — the set is fixed.
toolchain:
  analyzers:
    emit: Directory.Build.props
    set:
      EnableNETAnalyzers: true          # CA analysis (Roslyn) — ON by default for SDK projects net5+;
                                        #   set explicitly so it can never be silently dropped.
      AnalysisLevel: latest-Recommended # compound: newest ruleset, "Recommended" curated mode.
    # DISCUSS (see open items): AnalysisMode=All maximizes coverage (every rule → build warning,
    #   except legacy CA1017/CA1045/CA1005/CA1014/CA1060/CA1021 + code-metrics CA150x) but is noisy
    #   and version-fragile under TreatWarningsAsErrors; the curated .editorconfig below is the
    #   deterministic middle path.
    citation:
      url: https://learn.microsoft.com/dotnet/core/project-sdk/msbuild-props#enablenetanalyzers
      status: current
  formatter:
    emit: .editorconfig                 # committed; drives both `dotnet format` and IDE.
    set:
      tool: "dotnet format"             # subcommands: whitespace / style / analyzers
    citation:
      url: https://learn.microsoft.com/dotnet/core/tools/dotnet-format
      status: current
  style_in_build:
    emit: Directory.Build.props
    set:
      EnforceCodeStyleInBuild: true     # default FALSE → true runs IDExxxx (IDE0055 fmt, IDE1006 naming) at build.
    citation:
      url: https://learn.microsoft.com/dotnet/core/project-sdk/msbuild-props#enforcecodestyleinbuild
      status: current
  warnings:
    emit: Directory.Build.props
    set:
      TreatWarningsAsErrors: true       # default FALSE. NOTE: CodeAnalysisTreatWarningsAsErrors=false
                                        #   would exempt CA warnings under -warnaserror — we do NOT set it,
                                        #   so CA findings block the build too (see open items).
    citation:
      url: https://learn.microsoft.com/dotnet/csharp/language-reference/compiler-options/errors-warnings#treatwarningsaserrors
      status: current
  packages:
    emit: Directory.Packages.props
    set:
      ManagePackageVersionsCentrally: true   # CPM: version-less PackageReference; single source of versions.
    citation:
      url: https://learn.microsoft.com/nuget/consume-packages/central-package-management
      status: current

# ── strictness ────────────────────────────────────────────────────────────
# Build-failing switches. Each realizes a lang/dotnet rule id. These are the
# proactive gates that fail the build before a human looks.
strictness:
  - id: P-DN-S1
    flag: "<Nullable>enable</Nullable>"
    emit: Directory.Build.props
    realizes: lang/dotnet#DN6            # compile-time null-safety (CS86xx become errors under S2)
    citation: {url: "https://learn.microsoft.com/dotnet/csharp/nullable-references", status: current}
  - id: P-DN-S2
    flag: "<TreatWarningsAsErrors>true</TreatWarningsAsErrors>"
    emit: Directory.Build.props
    realizes: lang/dotnet#DN7            # no warning rot; analyzer + nullable findings block the build
    citation: {url: "https://learn.microsoft.com/dotnet/csharp/language-reference/compiler-options/errors-warnings#treatwarningsaserrors", status: current}
  - id: P-DN-S3
    flag: "<EnableNETAnalyzers>true</EnableNETAnalyzers> + <AnalysisLevel>latest-Recommended</AnalysisLevel>"
    emit: Directory.Build.props
    realizes: lang/dotnet#DN23           # deterministic, current rule set
    citation: {url: "https://learn.microsoft.com/dotnet/fundamentals/code-analysis/overview", status: current}
  - id: P-DN-S4
    flag: "<EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>"
    emit: Directory.Build.props
    realizes: lang/dotnet#DN19           # makes IDExxxx style rules (naming/formatting) build-failing; see P-DN-1
    citation: {url: "https://learn.microsoft.com/dotnet/core/project-sdk/msbuild-props#enforcecodestyleinbuild", status: current}
  - id: P-DN-S5
    flag: "<Deterministic>true</Deterministic> + <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild> (CI only)"
    emit: Directory.Build.props
    realizes: null                       # reproducible builds — no single lang id; profile-native
    citation: {url: "https://learn.microsoft.com/dotnet/core/project-sdk/msbuild-props#deterministic", status: current}

# ── conventions (→ §16) ─────────────────────────────────────────────────────
# P-DN-1..6 conventions, each with an enforcement{kind,detail}.
# Mechanical-first (CONTRACT §1.4): naming/formatting bind to analyzers; the rest
# fall to convention/pr_review and are FLAGGED in open items.
conventions:
  - id: P-DN-1
    item: file/symbol naming
    default: "PascalCase types + files; _camelCase private fields; one top-level type per file."
    enforcement:
      kind: analyzer
      detail: "IDE1006 (naming) severity=error via .editorconfig + naming-style rules; EnforceCodeStyleInBuild=true makes it build-failing."
    citation: {url: "https://learn.microsoft.com/dotnet/fundamentals/code-analysis/style-rules/naming-rules", status: current}
  - id: P-DN-1b
    item: formatting / whitespace
    default: "consistent whitespace, brace, using-directive ordering (dotnet format whitespace+style)."
    enforcement:
      kind: analyzer
      detail: "IDE0055 (formatting) severity=error via .editorconfig; enforced at build by EnforceCodeStyleInBuild and by `dotnet format` in CI."
    citation: {url: "https://learn.microsoft.com/dotnet/fundamentals/code-analysis/style-rules/ide0055", status: current}
  - id: P-DN-2
    item: test layout
    default: "tests/ parallel to src/; <Project>.Tests; method naming Method_State_Expected."
    enforcement:
      kind: pr_review        # FLAGGED — directory layout + test-method naming has no in-box analyzer
      detail: "structural: solution-layout check could assert tests/ ⇔ src/ pairing; method-name convention is pr_review-only."
    citation: {url: "https://learn.microsoft.com/dotnet/core/testing/unit-testing-best-practices#naming-your-tests", status: current}
  - id: P-DN-3
    item: nullable + analyzers on tests
    default: "test projects inherit the same strictness as src (no relaxed ruleset)."
    enforcement:
      kind: analyzer
      detail: "root Directory.Build.props applies to every project incl. tests/ — same S1..S4 switches; no per-test override."
    citation: {url: "https://learn.microsoft.com/dotnet/core/project-sdk/msbuild-props#enablenetanalyzers", status: current}
  - id: P-DN-4
    item: commits / versioning
    default: "Conventional Commits + SemVer."
    enforcement:
      kind: pr_review        # FLAGGED — CI lint (commit-message linter) possible but not an in-box .NET gate
      detail: "convention: enforce via a commit-message CI check + release tooling; nothing mechanical inside the C# build."
    citation: {url: "https://www.conventionalcommits.org/en/v1.0.0/", status: current}
  - id: P-DN-5
    item: ADR
    default: "MADR in docs/adr/, sequential numbering, status field."
    enforcement:
      kind: pr_review        # FLAGGED — documentation convention, no mechanical gate
      detail: "convention: a structural check can assert docs/adr/ exists + numbering monotonic; content review is pr_review."
    citation: {url: "https://adr.github.io/madr/", status: current}
  - id: P-DN-6
    item: README / docs
    default: "Diataxis structure; C4 diagrams; quickstart + ADR pointer."
    enforcement:
      kind: pr_review        # FLAGGED — documentation convention, no mechanical gate
      detail: "convention: doc structure + diagram presence are pr_review-only."
    citation: {url: "https://diataxis.fr/", status: current}
