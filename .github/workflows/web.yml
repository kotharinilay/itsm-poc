name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  lint-build-test:
    name: lint, build, test, accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # Enforces the library boundaries in plan §Dependency direction — a customer library
      # importing a staff library is an error here, not a review note.
      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npx tsc -b --pretty

      # Libraries build before applications: the workspace resolves them from dist/.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # WCAG 2.2 AA on all three surfaces, no best-effort surface (spec FR-SURF-010).
      #
      # UNCONDITIONAL. This step used to run the sweep only "if a test:a11y script exists", and none
      # did — so T049's sweep passed CI by never running, while printing that it had not arrived yet.
      # A gate that decides for itself whether to run is a gate whose failure mode is silence.
      - name: Install the browser for the sweep
        run: npx playwright install --with-deps chromium

      - name: Accessibility sweep
        run: npm run test:a11y

      # The policy SENT, not merely built: the portals are served through the reference hosting tier
      # and the browser's own violation reports are the assertion.
      - name: Content Security Policy
        run: npm run test:csp
